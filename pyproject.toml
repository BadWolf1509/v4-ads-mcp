[project]
name = "v4-ads-mcp"
version = "0.1.0"
description = "V4 Ads MCP — Google Ads + Meta Ads control via MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.2.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "google-ads>=27.0.0",
    "facebook-business>=21.0.0",
    "cryptography>=44.0.0",
    "jsonschema>=4.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "testcontainers[postgres]>=4.8.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_rate_limit.py" = ["F401"]  # spec-provided file; unused imports intentional

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.ads.*", "google.protobuf.*", "google.protobuf.field_mask_pb2"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["facebook_business.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# scripts/check_pre_push*.py are thin entries with dynamic sys.path imports
# from sibling _runner module. The dynamic import pattern (sys.path.insert
# then top-level import) is correct at runtime but unresolvable to mypy.
# _runner.py itself remains strictly type-checked.
[[tool.mypy.overrides]]
module = ["scripts.check_pre_push", "scripts.check_pre_push_full"]
ignore_errors = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that require a live DB",
]
