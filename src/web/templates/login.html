{% extends "_base.html" %}

{% block title %}Login — V4 Ads MCP{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 80px auto; text-align: center;">
  <img src="/static/logo/v4-symbol.svg" alt="V4" style="height: 64px; margin-bottom: 24px;">
  <h1 style="margin-bottom: 12px;">V4 Ads MCP</h1>
  <p style="color: var(--v4-gray-700); margin-bottom: 32px; font-size: 15px;">
    Conecte suas contas Google Ads ao Claude, Codex e outras IAs.

  <a href="/oauth/google/start?mode=panel_login" class="v4-btn v4-btn--primary" style="display: inline-flex; align-items: center; gap: 12px; font-size: 15px; padding: 12px 24px;">

    </svg>
    Entrar com Google V4

  <p style="margin-top: 32px; font-size: 13px; color: var(--v4-gray-300);">
    Acesso restrito a contas <code>@v4company.com</code>.
  </p>
</div>
{% endblock %}
