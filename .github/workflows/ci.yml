name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # concurrency no nível do JOB (não do workflow): cancela testes redundantes de
    # pushes rápidos SEM matar o job `deploy` (que chama deploy.yml) no meio. A
    # serialização de deploys fica na concurrency `deploy-prod` do deploy.yml.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    # (o `services: postgres` foi removido — era peso morto: os testes DB usam
    # testcontainers, que sobem o próprio container; o DSN localhost do conftest é
    # dummy e nunca é discado.)

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt = lockfile pinado (uv pip compile do pyproject, deps de
          # PROD) — o MESMO arquivo que o buildpack CNB instala no deploy. Instalar
          # ele primeiro + as dev deps constrained (-c) faz o CI testar exatamente os
          # pins que vão pra produção (fecha a janela "CI testou v0.115.4, deploy
          # rodou v0.115.5"). Regerar o lock:
          #   uv pip compile pyproject.toml -o requirements.txt --universal
          # O `--universal` NAO e opcional: sem ele o compile resolve pra plataforma
          # de quem rodou (a maquina do dev e Windows) e `pywin32` sai SEM marker,
          # entao o buildpack CNB tenta instala-lo no Linux e o build quebra.
          pip install -r requirements.txt
          pip install -e ".[dev]" -c requirements.txt

      - name: Security audit (pip-audit, non-blocking)
        # `continue-on-error: true` deixava o passo sair 1 e o GitHub pintar uma
        # annotation VERMELHA num run VERDE. O resultado ficava invisivel: em
        # 2026-09-02 havia 4 CVEs reais (aiohttp x3, cryptography) em
        # requirements.txt, e ninguem viu — annotation de run que passou nao e
        # lida. Pior: treina o time a ignorar annotation, num repo cujo catalogo
        # de findings e quase todo sobre aceitacao silenciosa.
        #
        # Segue non-blocking de proposito (CVE novo em dep transitiva nao deve
        # travar deploy de hotfix), mas agora por construcao — o passo trata os
        # proprios erros em vez de delegar ao runner — e o achado vai pro step
        # summary, que e onde alguem de fato le. Falha de INSTALACAO tambem e
        # reportada, em vez de virar auditoria que silenciosamente nao rodou.
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if ! pip install pip-audit; then
            {
              echo '### Security audit (pip-audit)'
              echo
              echo ':warning: **A auditoria nao rodou** — falha ao instalar o `pip-audit`.'
            } >> "$SUMMARY"
            exit 0
          fi
          set +e
          OUT=$(pip-audit -r requirements.txt 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          {
            echo '### Security audit (pip-audit)'
            echo
            if [ "$RC" -eq 0 ]; then
              echo 'Nenhuma vulnerabilidade conhecida em `requirements.txt`.'
            else
              echo ':rotating_light: **Vulnerabilidades conhecidas.** Nao bloqueia o build, mas precisa de acao:'
              echo
              echo '```'
              echo "$OUT"
              echo '```'
            fi
          } >> "$SUMMARY"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      # O CSS do Tailwind e gerado offline e commitado (nao ha build step no
      # runtime). Este guard regenera e falha se o artefato estiver defasado
      # em relacao as classes usadas nas templates. ubuntu-latest ja traz Node.
      - name: Tailwind CSS esta atualizado
        run: |
          python scripts/build_tailwind.py
          git diff --exit-code src/web/static/v4-tailwind.css \
            || (echo "::error::v4-tailwind.css desatualizado. Rode 'python scripts/build_tailwind.py' e commite." && exit 1)

      - name: Type check (mypy)
        run: mypy src

      - name: Unit + non-DB integration tests
        run: pytest tests/unit tests/integration -m "not integration" -v

      - name: DB integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pytest tests/integration -m integration -v

  # Deploy gated: só roda em push na main, DEPOIS do `test` verde, no MESMO commit
  # (needs → github.sha correto sem plumbing). Chama deploy.yml como reusable
  # workflow — a lógica de deploy continua inteira lá; aqui é só o gate.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write   # WIF — o called workflow não pode exceder as permissions do caller
