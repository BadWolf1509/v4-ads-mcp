name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # F138: o `deploy` passa a exigir esta saida. Ver o passo `detectar_mudanca`.
    outputs:
      code_changed: ${{ steps.detectar_mudanca.outputs.code_changed }}
    # concurrency no nível do JOB (não do workflow): cancela testes redundantes de
    # pushes rápidos SEM matar o job `deploy` (que chama deploy.yml) no meio. A
    # serialização de deploys fica na concurrency `deploy-prod` do deploy.yml.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    # (o `services: postgres` foi removido — era peso morto: os testes DB usam
    # testcontainers, que sobem o próprio container; o DSN localhost do conftest é
    # dummy e nunca é discado.)

    steps:
      - uses: actions/checkout@v7
        with:
          # F138: o passo `detectar_mudanca` compara dois SHAs, e num clone raso o
          # `git diff BASE..HEAD` nao acha a base. Repo tem 4.76 MiB / 921 commits,
          # entao o historico completo custa desprezivel.
          fetch-depth: 0

      - name: Detectar mudanca fora de docs (F138)
        id: detectar_mudanca
        # F138: commit que toca SO `docs/` publicava revisao nova do servidor MCP.
        # Este e o servidor por onde o gestor escreve nas contas dos clientes — um
        # deploy no meio de uma sequencia de update_rsa + apply_change tiraria a
        # ferramenta com writes parciais aplicados.
        #
        # A correcao NAO e `paths-ignore` no `on:` — isso foi verificado e e PIOR:
        # `test` e required status check na protecao da `main` (e `pr_required` esta
        # ligado), entao um PR so de documentacao nao dispararia o workflow, o check
        # nunca reportaria, e o PR travaria em "Expected — waiting for status" sem
        # caminho de merge que nao fosse bypass de admin. Trocaria "deploy
        # desnecessario" por "PR de docs impossivel de mergear".
        #
        # Aqui o `test` roda SEMPRE (o required check reporta, o PR mergeia) e so o
        # job `deploy` passa a exigir esta saida.
        #
        # Efeito colateral aceito: com o deploy pulado, o SHA em producao deixa de
        # ser o HEAD da `main`. Verificado que e benigno — a imagem e taggeada com
        # github.sha e os 3 Cloud Run Jobs apontam pra mesma tag, entao tudo fica
        # coerente no ultimo commit DE CODIGO, e nada no pipeline assere a igualdade.
        run: |
          BASE="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"

          # Fail-open de proposito: sem base confiavel (push inicial, force-push,
          # evento de PR), deploya. Um deploy a mais e melhor que um deploy que
          # devia acontecer e silenciosamente nao aconteceu, com producao parada
          # num commit antigo e ninguem sabendo.
          DECISAO=true
          MOTIVO="sem base confiavel para comparar — fail-open"

          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            ARQUIVOS=$(git diff --name-only "$BASE" "$HEAD_SHA")
            if [ -z "$ARQUIVOS" ]; then
              MOTIVO="diff vazio entre as bases — fail-open"
            elif printf '%s\n' "$ARQUIVOS" | grep -qvE '^docs/|\.md$'; then
              MOTIVO="ha mudanca fora de docs/"
            else
              DECISAO=false
              MOTIVO="o push mexeu apenas em docs/ e markdown"
            fi
          fi

          echo "code_changed=$DECISAO" >> "$GITHUB_OUTPUT"
          echo "code_changed=$DECISAO ($MOTIVO)"
          {
            echo "### Deploy"
            echo
            if [ "$DECISAO" = "true" ]; then
              echo "Deploy **habilitado** — $MOTIVO."
            else
              echo "Deploy **pulado** — $MOTIVO. A producao segue na revisao do ultimo commit de codigo (F138)."
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt = lockfile pinado (uv pip compile do pyproject, deps de
          # PROD) — o MESMO arquivo que o buildpack CNB instala no deploy. Instalar
          # ele primeiro + as dev deps constrained (-c) faz o CI testar exatamente os
          # pins que vão pra produção (fecha a janela "CI testou v0.115.4, deploy
          # rodou v0.115.5"). Regerar o lock:
          #   uv pip compile pyproject.toml -o requirements.txt --universal
          # O `--universal` NAO e opcional: sem ele o compile resolve pra plataforma
          # de quem rodou (a maquina do dev e Windows) e `pywin32` sai SEM marker,
          # entao o buildpack CNB tenta instala-lo no Linux e o build quebra.
          pip install -r requirements.txt
          pip install -e ".[dev]" -c requirements.txt

      - name: Security audit (pip-audit, non-blocking)
        # `continue-on-error: true` deixava o passo sair 1 e o GitHub pintar uma
        # annotation VERMELHA num run VERDE. O resultado ficava invisivel: em
        # 2026-09-02 havia 4 CVEs reais (aiohttp x3, cryptography) em
        # requirements.txt, e ninguem viu — annotation de run que passou nao e
        # lida. Pior: treina o time a ignorar annotation, num repo cujo catalogo
        # de findings e quase todo sobre aceitacao silenciosa.
        #
        # Segue non-blocking de proposito (CVE novo em dep transitiva nao deve
        # travar deploy de hotfix), mas agora por construcao — o passo trata os
        # proprios erros em vez de delegar ao runner — e o achado vai pro step
        # summary, que e onde alguem de fato le. Falha de INSTALACAO tambem e
        # reportada, em vez de virar auditoria que silenciosamente nao rodou.
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if ! pip install pip-audit; then
            {
              echo '### Security audit (pip-audit)'
              echo
              echo ':warning: **A auditoria nao rodou** — falha ao instalar o `pip-audit`.'
            } >> "$SUMMARY"
            exit 0
          fi
          set +e
          OUT=$(pip-audit -r requirements.txt 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          {
            echo '### Security audit (pip-audit)'
            echo
            if [ "$RC" -eq 0 ]; then
              echo 'Nenhuma vulnerabilidade conhecida em `requirements.txt`.'
            else
              echo ':rotating_light: **Vulnerabilidades conhecidas.** Nao bloqueia o build, mas precisa de acao:'
              echo
              echo '```'
              echo "$OUT"
              echo '```'
            fi
          } >> "$SUMMARY"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      # O CSS do Tailwind e gerado offline e commitado (nao ha build step no
      # runtime). Este guard regenera e falha se o artefato estiver defasado
      # em relacao as classes usadas nas templates. ubuntu-latest ja traz Node.
      - name: Tailwind CSS esta atualizado
        run: |
          python scripts/build_tailwind.py
          git diff --exit-code src/web/static/v4-tailwind.css \
            || (echo "::error::v4-tailwind.css desatualizado. Rode 'python scripts/build_tailwind.py' e commite." && exit 1)

      - name: Type check (mypy)
        run: mypy src

      - name: Unit + non-DB integration tests
        run: pytest tests/unit tests/integration -m "not integration" -v

      - name: DB integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pytest tests/integration -m integration -v

  # Deploy gated: só roda em push na main, DEPOIS do `test` verde, no MESMO commit
  # (needs → github.sha correto sem plumbing). Chama deploy.yml como reusable
  # workflow — a lógica de deploy continua inteira lá; aqui é só o gate.
  deploy:
    needs: test
    # F138: `code_changed` impede que commit so de docs publique revisao nova do
    # servidor MCP. O `test` continua rodando sempre — o required check reporta e
    # PR de docs mergeia normalmente; so o deploy e pulado.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.test.outputs.code_changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write   # WIF — o called workflow não pode exceder as permissions do caller
