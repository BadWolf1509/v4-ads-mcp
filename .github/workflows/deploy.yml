name: Deploy

# Gated: chamado por ci.yml (needs: test) só depois do CI verde no mesmo commit —
# antes CI e Deploy rodavam em paralelo e um push com suíte quebrada deployava
# assim mesmo (só o smoke segurava). workflow_dispatch = break-glass manual (deploy
# sem esperar testes; o gestor é owner do projeto GCP).
on:
  workflow_call: {}
  workflow_dispatch: {}

# concurrency no nível do workflow (aplica nos dois gatilhos): serializa deploys de
# produção. Vive aqui, não no ci.yml, pra o cancel-in-progress:true do CI não matar
# um deploy no meio (a concurrency do CI é job-level no `test`).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation
    env:
      # Os 3 Cloud Run Jobs rodam o MESMO codebase e chamam `get_settings()`,
      # que valida o Settings INTEIRO na subida — entao cada um precisa dos
      # mesmos campos obrigatorios do servico, inclusive `migrate` e `backup`,
      # que funcionalmente so usam o banco. Ate agora isso so existia na criacao
      # manual de cada job: sem fonte de verdade e sem guard (o F95 registrou os
      # jobs ainda montando 3 secrets ja removidos — a config manual deriva).
      #
      # `--update-*` e MERGE, nao replace: declarar aqui e idempotente e nao
      # apaga env que exista no job e nao esteja nesta lista.
      JOB_ENV_VARS: "APP_ENV=production"
      JOB_SECRETS: "DATABASE_URL=database-url:latest,SESSION_SIGNING_KEY=session-signing-key:latest,AES_MASTER_KEY=aes-master-key:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest,GOOGLE_ADS_DEVELOPER_TOKEN=google-ads-developer-token:latest,GOOGLE_ADS_LOGIN_CUSTOMER_ID=google-ads-login-customer-id:latest"

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit build via Buildpacks
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Submit async + poll: gcloud's default sync wait fails reading the
          # default logs bucket (SA lacks storage.objects.get). Async returns
          # immediately with a build ID; we poll status ourselves. Build logs
          # remain visible in Cloud Build Console.
          BUILD_ID=$(gcloud builds submit \
            --pack image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --async \
            --format='value(id)' \
            .)
          echo "Build submitted: $BUILD_ID"
          echo "Console: https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT_ID}"

          # Poll up to 15 minutes (90 * 10s)
          for i in $(seq 1 90); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --region=global --format='value(status)')
            echo "[poll $i] status=$STATUS"
            case "$STATUS" in
              SUCCESS) echo "Build succeeded"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Build failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Build timed out after 15 minutes"
          exit 1

      # F66 resolvido (2026-07-02): a imagem CNB expõe cada process do Procfile
      # via symlink `/cnb/process/<type>` (CNB Platform >=0.4). `--command` +
      # `--args=""` (limpa args residuais) invocam o process certo. Repassar aqui
      # a cada deploy mantém o job self-healing contra drift manual (o estado
      # anterior tinha `command: C:/…/launcher` manglado pelo Git Bash no Windows).
      - name: Update migration job image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run jobs update v4-ads-mcp-migrate \
            --image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --command=/cnb/process/migrate \
            --args="" \
            --region=${REGION} \
            --update-env-vars="${JOB_ENV_VARS}" \
            --update-secrets="${JOB_SECRETS}"

      - name: Update resync job image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run jobs update v4-ads-mcp-resync \
            --image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --command=/cnb/process/resync \
            --args="" \
            --region=${REGION} \
            --update-env-vars="${JOB_ENV_VARS}" \
            --update-secrets="${JOB_SECRETS},META_SYSTEM_USER_TOKEN=meta-system-user-token:latest"

      # Job de backup semanal (dump csv.gz por tabela → GCS). Re-aponta imagem +
      # process a cada deploy (self-healing contra drift, igual migrate/resync).
      # Env/secrets vem de JOB_ENV_VARS/JOB_SECRETS (merge): `backup` chama
      # get_settings() como os outros, entao NAO basta DATABASE_URL — precisa
      # dos 8 obrigatorios. O comentario anterior dizia o contrario.
      - name: Update backup job image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run jobs update v4-ads-mcp-backup \
            --image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --command=/cnb/process/backup \
            --args="" \
            --region=${REGION} \
            --update-env-vars="${JOB_ENV_VARS}" \
            --update-secrets="${JOB_SECRETS}"

      # F66 resolvido: com o job invocando o process `migrate` real, o execute
      # aplica migrations pendentes (idempotente — no-op se o schema já bate) e
      # a próxima 005_*.sql passa a ser aplicada de verdade (fim do skip silencioso).
      - name: Run database migrations
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run jobs execute v4-ads-mcp-migrate --region=${REGION} --wait

      - name: Capture serving revision (para rollback)
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          # Quem serve HOJE, antes de qualquer coisa mudar. O rollback antigo
          # deduzia a anterior por ordem de criacao, o que so vale se o deploy
          # TIVER criado uma revisao. Um `gcloud run deploy` que falhe antes
          # disso (imagem inexistente, por exemplo) deixava a deducao deslocada
          # em um, e o rollback tirava o trafego da revisao saudavel pra pousar
          # numa mais velha. Servico inexistente (1o deploy) -> vazio -> pula.
          SERVING=$(gcloud run services describe v4-ads-mcp \
            --region=${REGION} \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "Revisao servindo antes do deploy: ${SERVING:-<nenhuma>}"
          echo "SERVING_REVISION=${SERVING}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run deploy v4-ads-mcp \
            --image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --region=${REGION} \
            --service-account=v4-ads-mcp-runtime@${PROJECT_ID}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --set-env-vars="APP_ENV=production,APP_TIMEZONE=America/Sao_Paulo,LOG_LEVEL=info,BOOTSTRAP_ADMIN_EMAILS=wellington.ribeiro@v4company.com,PUBLIC_BASE_URL=https://v4-ads-mcp-299432068772.southamerica-east1.run.app" \
            --set-secrets="DATABASE_URL=database-url:latest,SESSION_SIGNING_KEY=session-signing-key:latest,AES_MASTER_KEY=aes-master-key:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest,GOOGLE_ADS_DEVELOPER_TOKEN=google-ads-developer-token:latest,GOOGLE_ADS_LOGIN_CUSTOMER_ID=google-ads-login-customer-id:latest,META_APP_ID=meta-app-id:latest,META_APP_SECRET=meta-app-secret:latest,META_SYSTEM_USER_TOKEN=meta-system-user-token:latest"

      - name: Route 100% traffic to latest revision
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          # gcloud run deploy normally auto-routes to the new revision, but a
          # one-off `update-traffic --to-revisions=X=100` (used during incident
          # debugging) PINS traffic to that specific revision and subsequent
          # deploys silently leave traffic on the old rev. --to-latest is
          # idempotent — safe to run on every deploy.
          gcloud run services update-traffic v4-ads-mcp \
            --region=${REGION} --to-latest

      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe v4-ads-mcp \
            --region=${{ secrets.GCP_REGION }} --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"

          # Retry /health for up to 90s — Cloud Run traffic propagation
          # can lag a few seconds after a new revision is deployed.
          echo "Probing /health?deep=1 (readiness — verifica o DB, with retry)..."
          for i in $(seq 1 18); do
            if curl -fsS "${SERVICE_URL}/health?deep=1" | grep -q '"db":"ok"'; then
              echo "  ✓ /health?deep=1 (DB ok) responded after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "  ✗ /health did not respond within 90s"
              exit 1
            fi
            sleep 5
          done

          # Phase 1a added a Bearer auth gate to /mcp. Smoke now verifies
          # the gate rejects unauthenticated requests with 401. Retry until
          # propagation completes — /health may switch revisions before /mcp.
          echo "Probing /mcp Bearer gate (expect 401, with retry)..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${SERVICE_URL}/mcp" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
            if [ "$STATUS" = "401" ]; then
              echo "  ✓ /mcp gated correctly (401) after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "  ✗ /mcp returned $STATUS (expected 401) after 90s — auth gate not enforcing"
              exit 1
            fi
            sleep 5
          done

          # MCP autenticado real: o 401 acima só prova que o gate rejeita. Este
          # passo prova que o stack MCP FUNCIONA de ponta a ponta — session
          # middleware resolve o Bearer, o dispatcher responde, o registry das
          # tools está montado. Sem isso, uma regressão no handshake/tools-list
          # passa o smoke e só aparece quando um gestor tenta usar (classe F58:
          # quebrado em prod porque nada consumia o caminho real). O Bearer é de
          # um manager "smoke" SEM nenhum grant (hard-gate nega toda operação de
          # conta; pior caso de vazamento = tools/list). server é stateless →
          # tools/list funciona sem initialize; a resposta pode vir SSE-framed
          # (event:/data:), então o grep varre o corpo inteiro.
          if [ -n "${SMOKE_MCP_BEARER}" ]; then
            echo "Probing /mcp autenticado (tools/list, expect 200 + list_my_accounts)..."
            # -w anexa o HTTP code na última linha; separamos code do corpo (que
            # pode vir SSE-framed, multi-linha). Distinguir a causa da falha é o
            # ponto: bearer inválido é problema de CREDENCIAL do CI, não da revisão.
            RESP=$(curl -s --max-time 20 -w "\n%{http_code}" -X POST "${SERVICE_URL}/mcp" \
              -H "Authorization: Bearer ${SMOKE_MCP_BEARER}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
            CODE=$(printf '%s' "$RESP" | tail -n1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            if echo "$BODY" | grep -q 'list_my_accounts'; then
              echo "  ✓ /mcp autenticado respondeu tools/list com o registry montado"
            elif [ "$CODE" = "401" ] || echo "$BODY" | grep -qiE 'unauthorized|session not found'; then
              # 401 aqui = Bearer inválido/expirado/revogado. O /health?deep=1 (SELECT 1
              # no pool) e o /mcp 401-gate JÁ provaram que o stack subiu — logo isto é
              # credencial de CI vencida, não regressão da revisão nova. NÃO bloqueia o
              # deploy; regenerar SMOKE_MCP_BEARER re-arma o check F58 automaticamente.
              echo "  ⚠ SMOKE_MCP_BEARER inválido/expirado (HTTP $CODE) — pulando smoke autenticado."
            else
              # 200 (ou não-401) SEM o registry = handshake/tools-list quebrado de verdade.
              echo "  ✗ /mcp autenticado retornou HTTP $CODE SEM o registry esperado — stack MCP quebrado"
              echo "  (primeiros 400 chars do corpo, sem o Bearer:)"
              echo "$BODY" | head -c 400
              exit 1
            fi
          else
            echo "  ⚠ SMOKE_MCP_BEARER ausente — pulando smoke MCP autenticado (configurar o secret)."
          fi
          echo "Smoke tests passed."
        env:
          SMOKE_MCP_BEARER: ${{ secrets.SMOKE_MCP_BEARER }}

      # Só reverte se o deploy do serviço chegou a rodar (outcome != skipped).
      # Sem este guard, uma falha ANTES do deploy (ex.: migrations, agora que o
      # step foi reativado) rebaixaria produção pra revisão anterior sem motivo —
      # nenhuma revisão nova foi criada, então "voltar uma" degrada o que está no ar.
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          # Volta o trafego pra revisao que ESTAVA servindo quando o job comecou,
          # capturada antes do deploy — nao pra a penultima por ordem de criacao,
          # que so coincide com ela quando o deploy chegou a criar revisao.
          if [ -n "${SERVING_REVISION}" ]; then
            echo "Revertendo trafego para ${SERVING_REVISION}"
            gcloud run services update-traffic v4-ads-mcp \
              --region=${REGION} --to-revisions="${SERVING_REVISION}=100" || echo "Rollback falhou"
          else
            echo "Sem revisao capturada (1o deploy?) — nada a reverter."
          fi
