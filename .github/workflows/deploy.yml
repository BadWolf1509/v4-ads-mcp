name: Deploy

# Gated: chamado por ci.yml (needs: test) só depois do CI verde no mesmo commit —
# antes CI e Deploy rodavam em paralelo e um push com suíte quebrada deployava
# assim mesmo (só o smoke segurava). workflow_dispatch = break-glass manual (deploy
# sem esperar testes; o gestor é owner do projeto GCP).
on:
  workflow_call: {}
  workflow_dispatch: {}

# concurrency no nível do workflow (aplica nos dois gatilhos): serializa deploys de
# produção. Vive aqui, não no ci.yml, pra o cancel-in-progress:true do CI não matar
# um deploy no meio (a concurrency do CI é job-level no `test`).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit build via Buildpacks
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Submit async + poll: gcloud's default sync wait fails reading the
          # default logs bucket (SA lacks storage.objects.get). Async returns
          # immediately with a build ID; we poll status ourselves. Build logs
          # remain visible in Cloud Build Console.
          BUILD_ID=$(gcloud builds submit \
            --pack image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --async \
            --format='value(id)' \
            .)
          echo "Build submitted: $BUILD_ID"
          echo "Console: https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT_ID}"

          # Poll up to 15 minutes (90 * 10s)
          for i in $(seq 1 90); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --region=global --format='value(status)')
            echo "[poll $i] status=$STATUS"
            case "$STATUS" in
              SUCCESS) echo "Build succeeded"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Build failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Build timed out after 15 minutes"
          exit 1

      # F66 resolvido (2026-07-02): a imagem CNB expõe cada process do Procfile
      # via symlink `/cnb/process/<type>` (CNB Platform >=0.4). `--command` +
      # `--args=""` (limpa args residuais) invocam o process certo. Repassar aqui
      # a cada deploy mantém o job self-healing contra drift manual (o estado
      # anterior tinha `command: C:/…/launcher` manglado pelo Git Bash no Windows).
      - name: Update migration job image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run jobs update v4-ads-mcp-migrate \
            --image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --command=/cnb/process/migrate \
            --args="" \
            --region=${REGION}

      - name: Update resync job image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run jobs update v4-ads-mcp-resync \
            --image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --command=/cnb/process/resync \
            --args="" \
            --region=${REGION} \
            --update-secrets="META_SYSTEM_USER_TOKEN=meta-system-user-token:latest"

      # F66 resolvido: com o job invocando o process `migrate` real, o execute
      # aplica migrations pendentes (idempotente — no-op se o schema já bate) e
      # a próxima 005_*.sql passa a ser aplicada de verdade (fim do skip silencioso).
      - name: Run database migrations
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run jobs execute v4-ads-mcp-migrate --region=${REGION} --wait

      - name: Deploy to Cloud Run
        id: deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run deploy v4-ads-mcp \
            --image=southamerica-east1-docker.pkg.dev/${PROJECT_ID}/v4-ads-mcp/app:${{ github.sha }} \
            --region=${REGION} \
            --service-account=v4-ads-mcp-runtime@${PROJECT_ID}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --set-env-vars="APP_ENV=production,APP_TIMEZONE=America/Sao_Paulo,LOG_LEVEL=info,BOOTSTRAP_ADMIN_EMAILS=wellington.ribeiro@v4company.com,PUBLIC_BASE_URL=https://v4-ads-mcp-299432068772.southamerica-east1.run.app" \
            --set-secrets="DATABASE_URL=database-url:latest,SESSION_SIGNING_KEY=session-signing-key:latest,AES_MASTER_KEY=aes-master-key:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest,GOOGLE_ADS_DEVELOPER_TOKEN=google-ads-developer-token:latest,GOOGLE_ADS_LOGIN_CUSTOMER_ID=google-ads-login-customer-id:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_KEY=supabase-service-key:latest,META_APP_ID=meta-app-id:latest,META_APP_SECRET=meta-app-secret:latest,META_SYSTEM_USER_TOKEN=meta-system-user-token:latest"

      - name: Route 100% traffic to latest revision
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          # gcloud run deploy normally auto-routes to the new revision, but a
          # one-off `update-traffic --to-revisions=X=100` (used during incident
          # debugging) PINS traffic to that specific revision and subsequent
          # deploys silently leave traffic on the old rev. --to-latest is
          # idempotent — safe to run on every deploy.
          gcloud run services update-traffic v4-ads-mcp \
            --region=${REGION} --to-latest

      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe v4-ads-mcp \
            --region=${{ secrets.GCP_REGION }} --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"

          # Retry /health for up to 90s — Cloud Run traffic propagation
          # can lag a few seconds after a new revision is deployed.
          echo "Probing /health?deep=1 (readiness — verifica o DB, with retry)..."
          for i in $(seq 1 18); do
            if curl -fsS "${SERVICE_URL}/health?deep=1" | grep -q '"db":"ok"'; then
              echo "  ✓ /health?deep=1 (DB ok) responded after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "  ✗ /health did not respond within 90s"
              exit 1
            fi
            sleep 5
          done

          # Phase 1a added a Bearer auth gate to /mcp. Smoke now verifies
          # the gate rejects unauthenticated requests with 401. Retry until
          # propagation completes — /health may switch revisions before /mcp.
          echo "Probing /mcp Bearer gate (expect 401, with retry)..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${SERVICE_URL}/mcp" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
            if [ "$STATUS" = "401" ]; then
              echo "  ✓ /mcp gated correctly (401) after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "  ✗ /mcp returned $STATUS (expected 401) after 90s — auth gate not enforcing"
              exit 1
            fi
            sleep 5
          done
          echo "Smoke tests passed."

      # Só reverte se o deploy do serviço chegou a rodar (outcome != skipped).
      # Sem este guard, uma falha ANTES do deploy (ex.: migrations, agora que o
      # step foi reativado) rebaixaria produção pra revisão anterior sem motivo —
      # nenhuma revisão nova foi criada, então "voltar uma" degrada o que está no ar.
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          # Roll service traffic to previous healthy revision (if one exists).
          PREV=$(gcloud run revisions list --service=v4-ads-mcp --region=${REGION} \
            --format='value(metadata.name)' --limit=2 | tail -n 1)
          if [ -n "$PREV" ]; then
            gcloud run services update-traffic v4-ads-mcp \
              --region=${REGION} --to-revisions="${PREV}=100" || echo "Rollback skipped: no prior revision"
          fi
