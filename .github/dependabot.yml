# Dependabot — bumps semanais. github-actions é o de maior valor (superfície
# supply-chain num workflow com id-token: write / WIF pra prod). pip agora controla
# de fato o que prod roda: existe requirements.txt pinado (uv pip compile do
# pyproject), instalado pelo buildpack CNB e pelo CI — os PRs do dependabot movem
# os pins, não só o range do pyproject. Majors de google-ads/facebook-business
# removem versões de API Google Ads/Graph — bump major deve ser deliberado, daí o ignore.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # grpcio-status X exige grpcio>=X — bumps em PRs separados quebram a
      # resolução do lockfile (PRs #6/#9, 2026-07). Grupo move a família junta.
      grpc:
        patterns: ["grpcio*"]
    ignore:
      - dependency-name: "google-ads"
        update-types: ["version-update:semver-major"]
      - dependency-name: "facebook-business"
        update-types: ["version-update:semver-major"]
      # pydantic pina pydantic-core EXATO (==) — bump isolado de pydantic-core é
      # sempre irresolvível (PR #5, 2026-07). O par sobe junto quando o pydantic
      # bumpar; se o PR do pydantic quebrar pelo pin do core, regerar o lockfile:
      # uv pip compile pyproject.toml -o requirements.txt --universal
      - dependency-name: "pydantic-core"
